name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v3.1.0). Leave empty to bump the patch of the latest tag.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

# One release at a time across branches, so two runs never compute the same next tag.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_name: duck2api-linux-amd64.tar.gz
            binary_name: duck2api
          - goos: windows
            goarch: amd64
            archive_name: duck2api-windows-amd64.tar.gz
            binary_name: duck2api.exe
          - goos: darwin
            goarch: amd64
            archive_name: duck2api-darwin-amd64.tar.gz
            binary_name: duck2api
          - goos: darwin
            goarch: arm64
            archive_name: duck2api-darwin-arm64.tar.gz
            binary_name: duck2api
          - goos: freebsd
            goarch: amd64
            archive_name: duck2api-freebsd-amd64.tar.gz
            binary_name: duck2api
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.binary_name }}" .
          tar -C dist -czf "${{ matrix.archive_name }}" "${{ matrix.binary_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          compression-level: 0

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          refs=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[] | "\(.ref) \(.object.sha) \(.object.type)"')

          # Reuse a tag that already points at this commit (e.g. a re-run), instead of minting a new one.
          existing=""
          while read -r ref obj type; do
            [ -z "${ref:-}" ] && continue
            if [ "$type" = "tag" ]; then
              obj=$(gh api "repos/$REPO/git/tags/$obj" --jq '.object.sha')
            fi
            if [ "$obj" = "$SHA" ]; then existing="${ref#refs/tags/}"; fi
          done <<< "$refs"

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            case "$version" in v*) ;; *) version="v$version" ;; esac
          elif [ -n "$existing" ]; then
            version="$existing"
          else
            latest=$(echo "$refs" | awk '{print $1}' | sed 's#refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: release-assets/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 8
